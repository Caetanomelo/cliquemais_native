org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# The project lives under "OneDrive\Área de Trabalho\..." (non-ASCII path).
# AGP's own path check rejects that on Windows; this disables just that check,
# per the guidance printed in the build failure itself.
android.overridePathCheck=true
